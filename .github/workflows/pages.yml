name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends webp
      - run: npm ci
      - run: npm run registry
      - name: Restore generated media cache
        uses: actions/cache@v4
        with:
          path: site/public/skin-media
          key: skin-media-v1-${{ runner.os }}-${{ hashFiles('registry/skins/**', 'scripts/media.mjs', 'scripts/build-media.mjs') }}
          restore-keys: |
            skin-media-v1-${{ runner.os }}-
      - run: npm run media:build
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
